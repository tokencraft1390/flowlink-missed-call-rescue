<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">FlowLink Missed Call Rescue architecture</title>
  <desc id="desc">A missed-call event is normalized, evaluated by two Strands tools, written to evidence, and stopped at a human approval boundary before external actions.</desc>
  <rect width="1600" height="720" fill="#07111f"/>
  <text x="800" y="72" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="34" font-weight="700">FlowLink Missed Call Rescue</text>
  <text x="800" y="112" text-anchor="middle" fill="#8fa9bd" font-family="Arial" font-size="19">Bounded Strands workflow — current demo boundary</text>
  <g font-family="Arial" font-size="20" text-anchor="middle" fill="#ffffff">
    <g stroke="#35d9ff" stroke-width="3" fill="#10263d">
      <rect x="70" y="245" width="250" height="130" rx="18"/>
      <rect x="390" y="245" width="250" height="130" rx="18"/>
      <rect x="710" y="205" width="300" height="210" rx="18"/>
      <rect x="1080" y="245" width="250" height="130" rx="18"/>
    </g>
    <rect x="1390" y="245" width="160" height="130" rx="18" fill="#332812" stroke="#ffcc66" stroke-width="3"/>
    <text x="195" y="297"><tspan x="195">AgentPhone</tspan><tspan x="195" dy="30">webhook / fixture</tspan></text>
    <text x="515" y="297"><tspan x="515">Normalize</tspan><tspan x="515" dy="30">and validate</tspan></text>
    <text x="860" y="255" font-size="25" font-weight="700">Strands Agent</text>
    <rect x="750" y="285" width="220" height="44" rx="12" fill="#193957" stroke="#a970ff" stroke-width="2"/>
    <rect x="750" y="345" width="220" height="44" rx="12" fill="#193957" stroke="#a970ff" stroke-width="2"/>
    <text x="860" y="314" font-size="16">analyze_missed_call</text>
    <text x="860" y="374" font-size="16">prepare_recovery_plan</text>
    <text x="1205" y="297"><tspan x="1205">Evidence record</tspan><tspan x="1205" dy="30">+ proposed plan</tspan></text>
    <text x="1470" y="288" font-size="18"><tspan x="1470">Human approval</tspan><tspan x="1470" dy="26">required</tspan><tspan x="1470" dy="26">no live action</tspan></text>
  </g>
  <g stroke="#a970ff" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M320 310 H385"/>
    <path d="M640 310 H705"/>
    <path d="M1010 310 H1075"/>
    <path d="M1330 310 H1385"/>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a970ff"/></marker></defs>
  <line x1="1380" y1="175" x2="1380" y2="465" stroke="#ffcc66" stroke-width="3" stroke-dasharray="12 10"/>
  <text x="1380" y="505" text-anchor="middle" fill="#ffcc66" font-family="Arial" font-size="18" font-weight="700">DEMO STOPS HERE</text>
  <text x="800" y="625" text-anchor="middle" fill="#b7c7d4" font-family="Arial" font-size="18">No SMS send · No Airtable write · No callback · No live provider traffic</text>
</svg>
