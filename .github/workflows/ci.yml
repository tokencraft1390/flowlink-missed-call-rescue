name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests
        run: npm test
      - name: Run controlled dry-run evidence
        run: npm run dry-run | tee dry-run-evidence.json
      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: missed-call-rescue-evidence
          path: dry-run-evidence.json
