name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install root dependencies
        run: npm install --ignore-scripts
      - name: Install Strands agent dependencies
        run: npm install --ignore-scripts --prefix strands-agent
      - name: Run tests
        run: npm test
      - name: Verify CALL-E SDK import
        run: node -e "import('./src/call-e-adapter.mjs').then(() => console.log('CALL-E adapter import OK'))"
      - name: Verify Strands wiring syntax
        run: node --check strands-agent/agent.js
      - name: Run controlled dry-run evidence
        run: npm run dry-run | tee dry-run-evidence.json
      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: missed-call-rescue-evidence
          path: dry-run-evidence.json
