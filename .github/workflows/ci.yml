name: evidence
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m rescue_agent.demo > strands-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: strands-offline-evidence
          path: strands-evidence.json
